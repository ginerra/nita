<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uganda National IT Skills Assessment 2026</title>
  <link rel="stylesheet" href="survey.css">
</head>
<body>

  <!-- (a) Header & introduction -->
  <header class="site-header">
    <!-- Inline CSS is used only here, as the brief requires -->
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRKgdAK681wL0v2VWaHkqGRjN2Jnq1rI9LY8n0iCOiR-w&s=10" alt="Uganda coat of arms" style="max-width:80px;">
    <h1>National Information Technology Authority — Uganda</h1>
  </header>

  <section class="banner">
    <img src="survey-banner.jpg" alt="Survey banner">
    <h2 class="banner-title">Uganda National IT Skills Assessment 2026</h2>
  </section>

  <nav class="progress" aria-label="Survey progress">
    <ol>
      <li class="step current" aria-current="step">
        <span class="step-number">1</span>
        <span class="step-label">Respondent Details</span>
      </li>
      <li class="step">
        <span class="step-number">2</span>
        <span class="step-label">Skills Assessment</span>
      </li>
      <li class="step">
        <span class="step-number">3</span>
        <span class="step-label">Submit</span>
      </li>
    </ol>
  </nav>

  <!-- (b) Respondent details -->
  <main>
    <form class="survey-form" action="#" method="post">
      <h2>Respondent Details</h2>

      <div class="form-group">
        <label for="title">Title</label>
        <select id="title" name="title">
          <option value="Mr">Mr</option>
          <option value="Mrs">Mrs</option>
          <option value="Ms">Ms</option>
          <option value="Dr">Dr</option>
        </select>
      </div>

      <div class="form-group">
        <label for="fullname">Full name</label>
        <input type="text" id="fullname" name="fullname" required minlength="4">
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" pattern="\+256[0-9]{9}"
               placeholder="+256700123456" title="Use the format +256 followed by 9 digits">
      </div>

      <div class="form-group">
        <label for="dob">Date of birth</label>
        <input type="date" id="dob" name="dob">
      </div>

      <div class="form-group" role="radiogroup" aria-labelledby="gender-label">
        <span class="group-label" id="gender-label">Gender</span>
        <div class="options">
          <label class="option"><input type="radio" name="gender" value="Male"> Male</label>
          <label class="option"><input type="radio" name="gender" value="Female"> Female</label>
          <label class="option"><input type="radio" name="gender" value="Prefer not to say"> Prefer not to say</label>
        </div>
      </div>

      <div class="form-group">
        <label for="region">Region</label>
        <select id="region" name="region">
          <option value="Central">Central</option>
          <option value="Eastern">Eastern</option>
          <option value="Northern">Northern</option>
          <option value="Western">Western</option>
        </select>
      </div>

      <div class="form-group" role="radiogroup" aria-labelledby="category-label">
        <span class="group-label" id="category-label">Respondent category</span>
        <div class="options">
          <label class="option"><input type="radio" name="category" value="ICT Professional"> ICT Professional</label>
          <label class="option"><input type="radio" name="category" value="Government Officer"> Government Officer</label>
          <label class="option"><input type="radio" name="category" value="Student"> Student</label>
        </div>
      </div>

      <button type="submit" class="btn">Continue to skills assessment</button>
    </form>
  </main>

</body>
</html>
